trigger:
  branches:
    include:
      - chakrav2

pool:
  name: YOUR_AGENT_POOL

steps:
  - script: |
      echo "Navigating to the project directory..."
      cd /home/azureuser/inventory_app  # ✅ Change this to your actual repo directory

      echo "Fetching latest changes..."
      if [ ! -d ".git" ]; then
        echo "Git repository not found, cloning..."
        git clone https://github.com/gos-user/inventory_app.git .
      else
        git reset --hard
        git pull origin chakrav2
      fi
    displayName: "Pull latest code"

  - script: |
      echo "Stopping existing containers if they are running..."
      docker ps -q --filter "name=backend" && docker-compose stop backend || echo "Backend not running"
      docker ps -q --filter "name=db" && docker-compose stop db || echo "Database not running"
      docker ps -q --filter "name=frontend" && docker-compose stop frontend || echo "Frontend not running"
      docker ps -q --filter "name=nginx-inventory" && docker-compose stop nginx-inventory || echo "Nginx not running"

      echo "Removing existing containers if they exist..."
      docker ps -aq --filter "name=backend" && docker-compose rm -f backend || echo "Backend container does not exist"
      docker ps -aq --filter "name=db" && docker-compose rm -f db || echo "Database container does not exist"
      docker ps -aq --filter "name=frontend" && docker-compose rm -f frontend || echo "Frontend container does not exist"
      docker ps -aq --filter "name=nginx-inventory" && docker-compose rm -f nginx-inventory || echo "Nginx container does not exist"
    displayName: "Stop & Remove Docker Containers"

  - script: |
      echo "Building and running containers..."
      docker-compose -f docker-compose.yml up -d --build
    displayName: "Run Docker Compose"
