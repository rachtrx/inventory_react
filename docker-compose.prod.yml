services:
  backend:
    build: ./services/backend
    container_name: inventory-backend
    ports:
      - "3001:3001"
    expose:
      - 3001
    depends_on:
      - db
    environment:
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - SIGNATURES_DIR=${SIGNATURES_DIR}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_HOST=db
    volumes:
      - ./services/backend/logs:/usr/src/app/logs
      - ./services/backend/uploads:/usr/src/app/uploads
    restart: always
    networks:
      - inventory_app
  db:
    build: 
      context: ./services/db
      dockerfile: Dockerfile
    container_name: inventory-db
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - inventory_app
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV}
        - REACT_APP_SSO_GRAPH_API_ENDPOINT=${REACT_APP_SSO_GRAPH_API_ENDPOINT}
        - REACT_APP_SSO_REDIRECT_URI=${REACT_APP_SSO_REDIRECT_URI}
        - REACT_APP_SSO_TENANT_ID=${REACT_APP_SSO_TENANT_ID}
        - REACT_APP_SSO_CLIENT_ID=${REACT_APP_SSO_CLIENT_ID}
    container_name: inventory-frontend
    ports:
      - "3000:3000"
    # volumes:
    #   - ./services/frontend:/workspace
    environment:
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
    restart: always
    networks:
      - inventory_app
  nginx-inventory:
    build: 
      context: ./services/nginx
      dockerfile: Dockerfile.prod
    container_name: inventory-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - inventory_app

volumes:
  postgres_data_prod:
  # static_volume:
  # uploads_volume:

networks:
  inventory_app:
    name: inventory_app
    driver: bridge
